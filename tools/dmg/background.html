<!doctype html>
<!--
  The disk image window's background, 660 x 400 points. This file is the
  source. background.png and background@2x.png are rendered from it by
  scripts/render-dmg-background.sh and committed, so a release needs no
  browser.

  Finder draws the two icons on top, centred at (180, 205) and (480, 205)
  with 128 point icons, as set in dmg-settings.py. The arrow sits on that
  centre line. Move one and move the other.

  The ground is light on purpose. Finder picks the icon label colour from the
  background, not from the system appearance, so dark labels stay readable
  on this paper in both light and dark mode.

  Type and colour follow keepresso.com: Atkinson Hyperlegible Next and
  JetBrains Mono, warm paper with copper and mocha washes, the burnt-copper
  accent. The render script supplies the font files.
-->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Atkinson; src: url(atkinsonhyperlegiblenext-latin.woff2) format("woff2"); font-weight: 200 800 }
@font-face { font-family: "JetBrains Mono"; src: url(jetbrainsmono-latin.woff2) format("woff2"); font-weight: 400 700 }
html, body { margin: 0; width: 660px; height: 400px; overflow: hidden }
body { position: relative; background: #faf6ee; font-family: Atkinson; -webkit-font-smoothing: antialiased }
.wash { position: absolute; inset: 0 }
.copper { background: radial-gradient(75% 90% at 8% -10%, rgba(179, 68, 30, .11), rgba(179, 68, 30, 0) 60%) }
.mocha { background: radial-gradient(80% 100% at 105% 110%, rgba(138, 90, 60, .12), rgba(138, 90, 60, 0) 60%) }
.mark { position: absolute; top: 42px; width: 100%; text-align: center; font-weight: 800; font-size: 27px; letter-spacing: -.02em; color: #241a10 }
.tagline { position: absolute; top: 82px; width: 100%; text-align: center; font-weight: 500; font-size: 13px; color: #6b6156 }
svg { position: absolute; left: 0; top: 0 }
.hint { position: absolute; top: 322px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: #f0e4d4; color: #773417; font-weight: 700; font-size: 12px; white-space: nowrap }
.domain { position: absolute; bottom: 22px; width: 100%; text-align: center; font-family: "JetBrains Mono"; font-weight: 500; font-size: 10.5px; letter-spacing: .32em; color: #b3441e }
</style></head><body>
<div class="wash copper"></div>
<div class="wash mocha"></div>
<div class="mark">Keepresso</div>
<div class="tagline">Keep your Mac awake, on your terms</div>
<svg width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="trail" x1="290" x2="368" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b3441e" stop-opacity=".3"/>
      <stop offset="1" stop-color="#b3441e"/>
    </linearGradient>
  </defs>
  <path d="M290 205 H366" stroke="url(#trail)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M359 197 L367.5 205 L359 213" fill="none" stroke="#b3441e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div class="hint">Drag to Applications</div>
<div class="domain">KEEPRESSO.COM</div>
</body></html>
