# Lint the repo's Python tooling (localization, release and DMG scripts).
# Bug-finding rules only, no style: these scripts come from upstream, and a
# formatter's churn would turn every upstream merge into a conflict.
target-version = "py39"  # the macOS Command Line Tools python3

[lint]
select = [
  "E4", "E7", "E9",  # import, statement and syntax errors
  "F",               # pyflakes: undefined names, unused imports, repeated keys
  "B",               # bugbear: likely bugs and design problems
  "DTZ",             # naive datetimes
  "C901",            # function complexity
  "PLR0915",         # function length in statements
]
ignore = [
  "E402",  # scripts put their own folder on sys.path before importing siblings
  "B905",  # zip(strict=) needs Python 3.10
]

# Same limits as the team's backend; scripts/check-swift-complexity.py applies
# them to Swift.
[lint.mccabe]
max-complexity = 12

[lint.pylint]
max-statements = 50

[lint.per-file-ignores]
# Upstream README demo generator: one long, linear drawing script.
"tools/readme-demo/gen_demo_svgs.py" = ["PLR0915"]
