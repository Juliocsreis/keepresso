# Dependency update PRs. Security updates are also on in the repository
# settings, so a known vulnerability gets a PR without waiting for the week.
#
# Not covered here: Sparkle, the app's only runtime dependency, is pinned in
# project.yml (XcodeGen), which Dependabot can't read. The weekly
# sparkle-watch workflow opens an issue when a newer Sparkle ships.
version: 2
updates:
  # Workflow actions are pinned to commit SHAs with a version comment;
  # Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  # Hash-pinned Python build tools: the DMG layout tool and the CI linters.
  - package-ecosystem: pip
    directories:
      - /tools/dmg
      - /tools/ci
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-tools:
        patterns: ["*"]
    commit-message:
      prefix: "Build tools"
